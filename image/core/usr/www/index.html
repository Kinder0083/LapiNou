<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<!-- LapiNou's home page on the rabbit (Task 12, R45): its status and quick controls, the settings and
     the updates, and LapinLibre's page under "Avancé" (avance.html). Texts come from lapinou/fr.json
     (data-t), the script is lapinou/app.js; nothing comes from outside the rabbit. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LapiNou</title>
<link rel="stylesheet" href="lapinou/tokens.css">
<link rel="stylesheet" href="lapinou/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="top">
  <a class="brand" href="#accueil"><span class="brand-mark" aria-hidden="true"></span><span data-t="app.title">LapiNou</span></a>
  <nav class="nav" data-t-label="nav.label">
    <a href="#accueil" data-nav="home" data-t="nav.home">Accueil</a>
    <a href="#reglages" data-nav="settings" data-t="nav.settings">Réglages</a>
    <a href="#maj" data-nav="updates" data-t="nav.updates">Mises à jour</a>
    <a href="avance.html" data-t="nav.advanced">Avancé</a>
  </nav>
</header>

<main>
  <p id="banner" class="banner" role="alert" hidden></p>

  <section id="view-home" class="view" data-view="home">
    <div class="hero">
      <div class="stage">
        <div id="rabbit" class="rabbit" aria-hidden="true"></div>
      </div>
      <div class="speech">
        <h1 id="hello" class="hello" data-t="load.wait">Je me réveille…</h1>
        <p id="mood" class="mood"></p>
        <ul id="stickers" class="stickers"></ul>
        <button type="button" id="refresh" class="link-button" data-t="home.refresh">Actualiser</button>
      </div>
    </div>

    <div class="toys">
      <section class="toy toy-led" aria-labelledby="led-title">
        <h2 id="led-title" data-t="led.title">Couleur du nez</h2>
        <p class="help" data-t="led.help"></p>
        <div id="led-swatches" class="swatches"></div>
        <p class="result" aria-live="polite"></p>
      </section>

      <section class="toy toy-ears" aria-labelledby="ears-title">
        <h2 id="ears-title" data-t="ears.title">Oreilles</h2>
        <p class="help" data-t="ears.help"></p>
        <div id="ears-presets" class="chips"></div>
        <p class="result" aria-live="polite"></p>
      </section>

      <section class="toy toy-say" aria-labelledby="say-title">
        <h2 id="say-title" data-t="say.title">Faire parler le lapin</h2>
        <form id="say-form" class="say">
          <label for="say-text" class="sr-only" data-t="say.label">Phrase à dire</label>
          <input id="say-text" name="text" type="text" maxlength="500" autocomplete="off">
          <button type="submit" class="button" data-t="say.go">Dire</button>
        </form>
        <p class="result" aria-live="polite"></p>
      </section>

      <section class="toy toy-volume" aria-labelledby="volume-title">
        <h2 id="volume-title" data-t="volume.title">Volume</h2>
        <div class="volume">
          <label for="volume" class="sr-only" data-t="volume.label">Volume du lapin</label>
          <input id="volume" type="range" min="0" max="100" step="5" value="60">
          <output id="volume-value" for="volume">60</output>
        </div>
        <p class="result" aria-live="polite"></p>
      </section>
    </div>
  </section>

  <section id="view-settings" class="view" data-view="settings" hidden>
    <h1 class="page-title" data-t="settings.title">Réglages</h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="etat" data-t="tab.etat">État</button>
      <button type="button" role="tab" data-tab="reseau" data-t="tab.reseau">Réseau</button>
      <button type="button" role="tab" data-tab="mqtt" data-t="tab.mqtt">MQTT</button>
      <button type="button" role="tab" data-tab="serveur" data-t="tab.serveur">Serveur LapiNou</button>
      <button type="button" role="tab" data-tab="cloud" data-t="tab.cloud">Mode sans serveur</button>
      <button type="button" role="tab" data-tab="voix" data-t="tab.voix">Voix et son</button>
      <button type="button" role="tab" data-tab="securite" data-t="tab.securite">Sécurité</button>
      <button type="button" role="tab" data-tab="maj" data-t="tab.maj">Mises à jour</button>
    </div>
    <div id="panel" class="panel" role="tabpanel"></div>
  </section>
</main>

<script src="lapinou/app.js"></script>
</body>
</html>
