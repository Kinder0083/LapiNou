<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="ln-rabbit-title">
<!-- SPDX-License-Identifier: MIT -->
<!-- LapiNou's rabbit (R45), drawn like a Karotz: a round body, two long ears, the LED nose. The page
     puts it inline (app.js) and styles it with the classes below: .ln-ear turns (left and right,
     round their base), .ln-led takes the LED's colour (the CSS variable ln-led). The fills here are for the file
     on its own. -->
<title id="ln-rabbit-title">Le lapin</title>
<g class="ln-ear ln-ear-left" transform-origin="92 112">
  <path class="ln-fur" d="M92 112 C70 74 58 26 72 10 C88 -6 112 40 110 108 Z" fill="#fff" stroke="#1b2a4a" stroke-width="6" stroke-linejoin="round"/>
  <path class="ln-ear-in" d="M93 96 C80 70 74 36 80 26 C88 18 102 52 102 94 Z" fill="#ff5c93"/>
</g>
<g class="ln-ear ln-ear-right" transform-origin="148 112">
  <path class="ln-fur" d="M148 112 C170 74 182 26 168 10 C152 -6 128 40 130 108 Z" fill="#fff" stroke="#1b2a4a" stroke-width="6" stroke-linejoin="round"/>
  <path class="ln-ear-in" d="M147 96 C160 70 166 36 160 26 C152 18 138 52 138 94 Z" fill="#ff5c93"/>
</g>
<path class="ln-fur" d="M120 100 C178 100 212 160 208 214 C204 266 168 292 120 292 C72 292 36 266 32 214 C28 160 62 100 120 100 Z" fill="#fff" stroke="#1b2a4a" stroke-width="6"/>
<ellipse class="ln-belly" cx="120" cy="232" rx="58" ry="46" fill="#e9f5ff"/>
<circle class="ln-eye" cx="96" cy="156" r="8" fill="#1b2a4a"/>
<circle class="ln-eye" cx="144" cy="156" r="8" fill="#1b2a4a"/>
<circle class="ln-shine" cx="99" cy="153" r="2.5" fill="#fff"/>
<circle class="ln-shine" cx="147" cy="153" r="2.5" fill="#fff"/>
<ellipse class="ln-cheek" cx="78" cy="180" rx="11" ry="7" fill="#ff5c93" opacity=".45"/>
<ellipse class="ln-cheek" cx="162" cy="180" rx="11" ry="7" fill="#ff5c93" opacity=".45"/>
<path class="ln-mouth" d="M110 182 Q120 192 130 182" fill="none" stroke="#1b2a4a" stroke-width="5" stroke-linecap="round"/>
<circle class="ln-glow" cx="120" cy="232" r="30" fill="#3ddc97" opacity=".35"/>
<circle class="ln-led" cx="120" cy="232" r="17" fill="#3ddc97" stroke="#1b2a4a" stroke-width="5"/>
</svg>
