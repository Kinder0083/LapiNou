# SPDX-License-Identifier: MIT
[project]
name = "lapinou"
version = "0.3.0"
description = "Serveur LapiNou (passerelle vocale pour lapins Karotz)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "sherpa-onnx==2.0.1",  # Parakeet + Silero VAD (version de tools/app-server)
    # Annulation d'écho (SpeexDSP). Roues PyPI pour Python 3.13 seulement ; en 3.12, compilée à
    # l'installation (paquets libspeexdsp-dev, python3-dev, gcc)
    "speexaec==0.1.3",
    # Synthèse vocale : MP3 (lameenc) et Kokoro (versions de tools/app-server)
    "lameenc>=1.7",
    "kokoro-onnx==0.6.1",
    # Cerveaux : Claude (API Messages), fournisseurs compatibles OpenAI, Assist de Home Assistant
    "anthropic==2.8.0",
    "openai==3.51.0",
    "httpx2>=2.16",
    # Client MCP (stdio) vers ha-mcp, lancé en sous-processus
    "mcp==2.3.0",
    # Fuseaux horaires (zoneinfo) même sans base système (images Docker minimales)
    "tzdata>=2024.1",
    # Configurations de scripts que ha-mcp peut renvoyer en YAML (chargeur sûr seulement)
    "pyyaml>=6.0",
    # État de l'assistant publié sur MQTT (lapinou/<id>/assistant) pour Home Assistant
    "paho-mqtt==2.1.0",
    # Mot de passe admin de la page de réglages (haché argon2id)
    "argon2-cffi>=23.1",
    # Signature Ed25519 des versions OTA (R42), vérifiée par le relais
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lapinou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["safety: réglages de sécurité (SafetyConfig) pour la fixture ha"]
