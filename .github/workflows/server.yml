# SPDX-License-Identifier: MIT
# LapiNou's server and installer tests, on every push to a branch and every pull request, and
# from the release workflow before a release is published (workflow_call). One job: the
# installer's tests use the server's venv. Neither needs the firmware build. The server's tests use no network service and no model (fakes); the
# installer's run Proxmox and system commands as stubs (installer/tests/run.sh).
name: server

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # What installer/provision.sh installs for the server: speexaec is compiled for Python 3.12
      # (libspeexdsp-dev, python3-dev, gcc), ffmpeg for the sounds, protoc for userland/proto.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg protobuf-compiler libspeexdsp-dev \
              python3-dev gcc libc6-dev openssl shellcheck

      # The uv version of installer/provision.sh and server/Dockerfile.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Server tests
        working-directory: server
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Shell checks of the release script
        run: shellcheck scripts/lapinou-release.sh

      # After the server tests: the case "réglages réels" of run.sh writes the settings with the
      # server's own venv (server/.venv), else it is skipped; it must run here. run.sh also runs
      # shellcheck on the installer's scripts.
      - name: Installer tests
        env:
          LAPINOU_TEST_PYTHON: ${{ github.workspace }}/server/.venv/bin/python
        run: |
          set -o pipefail
          test -x "$LAPINOU_TEST_PYTHON"
          bash installer/tests/run.sh | tee "$RUNNER_TEMP/installer.log"
          ! grep -q "réglages réels ignorés" "$RUNNER_TEMP/installer.log"
